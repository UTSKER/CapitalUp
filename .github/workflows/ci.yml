name: CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'capitalup-backend/package-lock.json'
      - name: Install Dependencies
        working-directory: ./capitalup-backend
        run: npm ci || npm install
      - name: Run ESLint
        working-directory: ./capitalup-backend
        run: npm run lint

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'Frontend/package-lock.json'
      - name: Install Dependencies
        working-directory: ./Frontend
        run: npm ci || npm install
      - name: Run ESLint
        working-directory: ./Frontend
        run: npm run lint

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'capitalup-backend/package-lock.json'
      - name: Install Dependencies
        working-directory: ./capitalup-backend
        run: npm ci || npm install
      - name: Run Tests
        working-directory: ./capitalup-backend
        run: npm test

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'Frontend/package-lock.json'
      - name: Install Dependencies
        working-directory: ./Frontend
        run: npm ci || npm install
      - name: Run Tests
        working-directory: ./Frontend
        run: npm test

  build-frontend:
    name: Build Frontend (Verify Compilation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'Frontend/package-lock.json'
      - name: Install Dependencies
        working-directory: ./Frontend
        run: npm ci || npm install
      - name: Build Application
        working-directory: ./Frontend
        run: npm run build

  docker-build:
    name: Verify Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker Compose
        run: docker compose build
